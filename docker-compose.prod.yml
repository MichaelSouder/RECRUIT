# Run pre-built images from GitHub Container Registry (built on push to main).
#
# Prerequisites:
#   1. Push to main (or run the "Build and push Docker images" workflow manually).
#   2. If packages are private: docker login ghcr.io -u USERNAME -p TOKEN
#   3. Set DOCKER_IMAGE_PREFIX to match your GHCR namespace (lowercase GitHub username/org).
#
# Usage:
#   export DOCKER_IMAGE_PREFIX=ghcr.io/yourgithubusername
#   export INITIAL_ADMIN_PASSWORD='choose-a-strong-password'   # first boot only (empty DB)
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# First boot creates admin@example.com only when the users table is empty and
# INITIAL_ADMIN_PASSWORD is set. Set SECRET_KEY and DB passwords for real deployments.

services:
  postgres:
    image: postgres:15
    container_name: recruit_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recruit_db
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - recruit_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: recruit_redis
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - recruit_network
    restart: unless-stopped

  backend:
    image: ${DOCKER_IMAGE_PREFIX:-ghcr.io/michaelsouder}/recruit-backend:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: recruit_backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/recruit_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - CORS_ORIGINS=http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:80,http://localhost:18080,http://frontend:80,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:18080
      - ENVIRONMENT=production
      - DEBUG=false
      - SEED_INITIAL_ADMIN=true
      - INITIAL_ADMIN_EMAIL=admin@example.com
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-}
    ports:
      - "18000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - recruit_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    entrypoint: >
      sh -c "
        echo 'Waiting for PostgreSQL...' &&
        until pg_isready -h postgres -U postgres; do sleep 1; done &&
        echo 'PostgreSQL is ready!' &&
        echo 'Initializing database...' &&
        python -c 'import app.models; from app.database import Base, engine; Base.metadata.create_all(bind=engine)' 2>&1 || true &&
        python scripts/add_assessment_time_to_assessments.py 2>&1 || echo 'Migration may have already run' &&
        echo 'Database initialized!' &&
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
      "

  frontend:
    image: ${DOCKER_IMAGE_PREFIX:-ghcr.io/michaelsouder}/recruit-frontend:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: recruit_frontend
    ports:
      - "18080:80"
    depends_on:
      - backend
    networks:
      - recruit_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/recruit/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  recruit_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
