# Builds/pulls all images needed for production and uploads them as a downloadable artifact.
# Does not store large binaries in git — download from the workflow run’s Artifacts section.

name: Export container images

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set IMAGE_PREFIX (GHCR, lowercase)
        run: |
          p=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_PREFIX=ghcr.io/${p}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Export images to output/container-images
        run: |
          chmod +x scripts/export-container-images.sh
          ./scripts/export-container-images.sh

      - name: List exported files (verify Postgres + Redis + app images)
        run: |
          ls -la output/container-images/
          test -f output/container-images/postgres-15.tar
          test -f output/container-images/redis-7-alpine.tar
          test -f output/container-images/recruit-backend.tar
          test -f output/container-images/recruit-frontend.tar
          test -f output/container-images/AIRGAP_DEPLOY.md
          test -f output/container-images/load-container-images.sh
          test -x output/container-images/load-container-images.sh

      # Split into two artifacts so Postgres/Redis are clearly visible and to reduce single-zip size limits.
      - name: Upload artifact — Postgres & Redis (infrastructure)
        uses: actions/upload-artifact@v4
        with:
          name: recruit-infra-postgres-redis
          path: |
            output/container-images/postgres-15.tar
            output/container-images/redis-7-alpine.tar
            output/container-images/README-AIR-GAP.txt
            output/container-images/AIRGAP_DEPLOY.md
            output/container-images/load-container-images.sh
          if-no-files-found: error
          retention-days: 30

      - name: Upload artifact — RECRUIT backend & frontend
        uses: actions/upload-artifact@v4
        with:
          name: recruit-app-backend-frontend
          path: |
            output/container-images/recruit-backend.tar
            output/container-images/recruit-frontend.tar
            output/container-images/MANIFEST.txt
            output/container-images/README-AIR-GAP.txt
            output/container-images/AIRGAP_DEPLOY.md
            output/container-images/load-container-images.sh
          if-no-files-found: error
          retention-days: 30
