# Host nginx reverse-proxy block for RECRUIT served at /recruit-platform/
#
# The container frontend is built with base path /recruit/.  This block proxies
# /recruit-platform/ -> container port 18080/recruit/ and rewrites all path
# references in responses so the browser never sees /recruit/.
#
# Usage:
#   1. Copy or include this file in your nginx server {} block:
#        include /path/to/repo/config/nginx-recruit-platform.conf;
#      or copy to /etc/nginx/conf.d/ and reload.
#   2. Test and reload:
#        nginx -t && systemctl reload nginx
#   3. Open: http://YOUR_SERVER/recruit-platform/
#
# Requires: ngx_http_sub_module (included in standard RHEL nginx packages)

location /recruit-platform/ {
    proxy_pass http://127.0.0.1:18080/recruit/;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Disable upstream gzip so sub_filter can rewrite path strings in responses
    proxy_set_header Accept-Encoding   "";

    # Rewrite all /recruit/ path references in HTML/JS/CSS back to /recruit-platform/
    sub_filter_once off;
    sub_filter_types text/html text/css application/javascript application/json;
    sub_filter '/recruit/' '/recruit-platform/';

    # Rewrite Location: headers sent by upstream redirects
    proxy_redirect /recruit/ /recruit-platform/;
}
