services:
  postgres:
    image: postgres:15
    container_name: recruit_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recruit_db
    # Host port avoids clashing with docker-compose.postgres-snapshot.yml (also :15432).
    ports:
      - "25432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - recruit_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: recruit_redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - recruit_network
    restart: unless-stopped

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: recruit_backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/recruit_db
      - PG_WAIT_HOST=postgres
      - PG_WAIT_PORT=5432
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set (32+ chars) - see docs/DEPLOY_PODMAN.md}
      - SSN_ENCRYPTION_KEY=${SSN_ENCRYPTION_KEY:?SSN_ENCRYPTION_KEY must be set (32+ chars) - see docs/DEPLOY_PODMAN.md}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - CORS_ORIGINS=http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:80,http://localhost:18080,http://frontend:80,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:18080
      - ENVIRONMENT=production
      - DEBUG=false
    ports:
      - "18000:8000"
    volumes:
      # Mount source code for development (comment out for production)
      - ./src/backend:/app
      # Exclude venv and cache
      - /app/venv
      - /app/__pycache__
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - recruit_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Initialize database on first startup
    entrypoint: >
      sh -c "
        echo \"Waiting for PostgreSQL at $$PG_WAIT_HOST:$$PG_WAIT_PORT (max ~120s)...\" &&
        i=0 &&
        until pg_isready -h \"$$PG_WAIT_HOST\" -p \"$$PG_WAIT_PORT\" -U postgres; do
          i=$$((i+1)) &&
          if [ $$i -ge 120 ]; then
            echo 'ERROR: PostgreSQL did not become ready. For compose internal DB: docker compose up -d postgres. For migrated data on host :15432 see docker-compose.use-host-snapshot-db.yml.' &&
            exit 1
          fi &&
          sleep 1
        done &&
        echo 'PostgreSQL is ready!' &&
        echo 'Initializing database...' &&
        python -c 'import app.models; from app.database import Base, engine; Base.metadata.create_all(bind=engine)' 2>&1 || true &&
        python scripts/add_assessment_time_to_assessments.py 2>&1 || echo 'Migration may have already run' &&
        echo 'Database initialized!' &&
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
      "

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: /
        # Leave empty so the browser uses same-origin /api/... and nginx proxies to backend
        # (avoids cross-origin calls to :18000 and broken setups when using 127.0.0.1 vs localhost).
        VITE_API_URL: ""
        NGINX_CONFIG: default
        HEALTH_URI: /health
    container_name: recruit_frontend
    ports:
      - "18080:80"
    depends_on:
      - backend
    networks:
      - recruit_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  recruit_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
